#
# Console and application
#
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=2048

#
# GPIO — LEDs and other digital I/O
#
CONFIG_GPIO=y

#
# Interactive shell over UART
#
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="SCU200>"

# Help, command history and tab completion
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y

# Kernel inspection commands
CONFIG_KERNEL_SHELL=y

# Shell stack and command/output buffers
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_PRINTF_BUFF_SIZE=256

#
# SPI NOR flash
#
#CONFIG_SPI=y
#CONFIG_SPI_NOR=y

# Read flash capabilities from its SFDP tables at runtime
#CONFIG_SPI_NOR_SFDP_RUNTIME=y

#CONFIG_FLASH=y
#CONFIG_FLASH_MAP=y
#CONFIG_FLASH_SHELL=y

#
# I2C EEPROM — M24C64 through the AT24-compatible driver
#
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_EEPROM_SHELL=y

#
# Test-only random generator for a target without an entropy driver
#
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

#
# Ethernet — Xilinx AXI Ethernet with AXI DMA
#
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y

CONFIG_DMA=y
CONFIG_DMA_XILINX_AXI_DMA=y
CONFIG_ETH_XILINX_AXIENET=y

#
# AXI Ethernet RX requires a complete frame in each network buffer.
# Allow space for Ethernet headers and alignment.
#
CONFIG_NET_BUF_DATA_SIZE=2048


# MDIO accesses the external PHY's management registers.
# The overlay's "ethernet-phy" compatible selects the generic PHY.
CONFIG_MDIO=y

#
# IPv4 and ping
#
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y

#
# IPv4 networking — includes ICMPv4 for ping requests and replies
#
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_IPV6=n

# IPv4-only configuration
CONFIG_NET_IPV6=n

#
# TCP and socket API
#
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

#
# Static IPv4 configuration
# Change these values to match your LAN.
# Choose an unused address outside the DHCP allocation range.
#
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.0.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.0.1"

#
# Network shell — interface inspection and ping
#
CONFIG_NET_SHELL=y
CONFIG_MDIO_SHELL=y
#
# Logging
#
CONFIG_LOG=y

# Detailed flash logging retained for bring-up
#CONFIG_FLASH_LOG_LEVEL_DBG=y

# Enable when troubleshooting SPI transactions
# CONFIG_SPI_LOG_LEVEL_DBG=y
#
#
# Fatal-error diagnostics
#
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_DEBUG=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y

#
# More logging
#
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=1
#CONFIG_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_NET_LOG=y

#
# Give interrupt and networking paths additional headroom
#
CONFIG_ISR_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_STATISTICS=y

# MicroBlaze V LPDDR5 data cache support.
CONFIG_MBV_ZICBOM=y
CONFIG_DCACHE_LINE_SIZE=16
# AXI DMA is not cache coherent with the MicroBlaze V write-back cache.
# Flush CPU-written descriptors/TX buffers before DMA access and
# invalidate RX buffers/descriptors after DMA access.
CONFIG_DMA_XILINX_AXI_DMA_MANUAL_CACHE_COHERENCY=y
